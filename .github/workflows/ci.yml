name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: monopoly-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: monopoly-api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  ui:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: monopoly-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "16"
          cache: npm
          cache-dependency-path: monopoly-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --watchAll=false
        env:
          CI: "true"
      - run: npm run build
        env:
          CI: "false" # existing lint warnings would otherwise fail the build
          REACT_APP_API_BASE_URL: https://example.invalid
          REACT_APP_API_TIMEOUT: "60000"
